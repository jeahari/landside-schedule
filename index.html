<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAX Landside Schedule</title>
<meta name="theme-color" content="#0E2A47">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-v2-192.png">
<link rel="apple-touch-icon" href="icon-v2-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LAX Landside">
<script>window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; window.dispatchEvent(new Event('bip-ready')); });</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2A47; --navy2:#173B61; --bg:#F3F5F8; --card:#fff; --ink:#14202E; --muted:#66758A;
    --line:#DDE3EA; --red:#C8282E; --redbg:#FDECEC;
    --D:#BDD7EE; --Dk:#2F6A9E; --S:#FFE45C; --Sk:#7A6300; --N:#CBC3EC; --Nk:#4B3F8F; --leave:#E7EAEE;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
  button,input,select{font-family:inherit}
  [hidden]{display:none!important}
  /* ----- sign-in screen ----- */
  .auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,var(--navy) 0,var(--navy) 42%,var(--bg) 42%)}
  .auth .card{width:100%;max-width:400px;padding:30px 28px 24px;border:0;border-radius:16px;box-shadow:0 18px 50px rgba(14,42,71,.22),0 2px 6px rgba(14,42,71,.08)}
  .auth .logo{display:block;height:38px;width:auto;margin:0 auto 18px}
  .auth h1{font-size:21px;font-weight:800;letter-spacing:-.2px;margin:0;text-align:center;color:var(--navy)}
  .auth .sub{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 22px}
  .auth .f{margin-bottom:14px}
  .auth label{font-size:12.5px;color:#3E4C5E}
  .auth input{padding:11px 12px;font-size:15px;border-radius:10px;border-color:#CFD7E1}
  .auth input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(23,59,97,.15)}
  .auth .btn.primary{width:100%;padding:12px;font-size:15px;border-radius:10px;margin-top:4px}
  .auth .note{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.45;text-align:center}
  .auth .demo{background:#F4F7FB;border:1px solid #E1E8F0;border-radius:10px;padding:9px 11px;font-size:12px;color:#3E4C5E;margin-top:14px;line-height:1.5}
  .auth .foot{margin-top:18px;max-width:400px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
  .auth .foot p,.appfoot p{margin:0 0 4px}
  .auth .foot a,.appfoot a{color:var(--navy2);font-weight:600;text-decoration:none}
  .auth .foot a:hover,.appfoot a:hover{text-decoration:underline}
  .appfoot{max-width:1180px;margin:8px auto 0;padding:14px 16px 24px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
  @media (max-width:700px){.appfoot{padding-bottom:calc(90px + env(safe-area-inset-bottom))}}
  /* ----- app header ----- */
  header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto;padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .logo{height:26px;width:auto;display:block}
  .brand .div{width:1px;height:26px;background:var(--line)}
  .brand .t{font-weight:700;font-size:15px;color:var(--navy);white-space:nowrap;line-height:1.2;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .brand .t small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
  .userbox{display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
  .uname{font-size:13px;font-weight:600;line-height:1.2;text-align:right}
  .uname small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
  .iconbtn{background:none;border:1px solid var(--line);border-radius:8px;height:32px;padding:0 10px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font:600 12.5px Inter,system-ui}
  .iconbtn:hover{background:#F4F6F9}
  nav.tabs{background:#fff;border-bottom:1px solid var(--line)}
  nav.tabs .in{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:0 10px;overflow-x:auto}
  nav.tabs button{background:none;border:0;color:var(--muted);font:600 14px Inter,system-ui;padding:12px 12px 10px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
  nav.tabs button svg{width:17px;height:17px;flex:none}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
  main{max-width:1180px;margin:0 auto;padding:16px 12px 70px}
  @media (max-width:700px){
    .brand .t small,.uname,.brand .div,.userbox .avatar{display:none}
    .hrow{padding-top:9px;padding-bottom:9px}
    .brand .logo{height:22px}
    .brand .t{font-size:14px}
    .iconbtn span{display:none}
    nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(14,42,71,.06)}
    nav.tabs .in{justify-content:space-around;padding:0;gap:0}
    nav.tabs button{flex:1;flex-direction:column;gap:3px;font-size:10.5px;padding:8px 2px 7px;border-bottom:0;border-top:2.5px solid transparent;position:relative}
    nav.tabs button.on{border-top-color:var(--navy);border-bottom-color:transparent}
    nav.tabs button svg{width:21px;height:21px}
    nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);margin:0}
    main{padding-bottom:16px}
  }
  .banner{background:#FFF6D6;border:1px solid #F0DC94;color:#6B5600;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
  .cards{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-bottom:16px}
  @media (max-width:760px){.cards{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .sl{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
  .sl + .sl{border-top:1px dashed var(--line)}
  .tag{display:inline-block;min-width:54px;text-align:center;font:700 12px system-ui;padding:4px 8px;border-radius:6px}
  .tag.D{background:var(--D);color:var(--Dk)} .tag.S{background:var(--S);color:var(--Sk)} .tag.N{background:var(--N);color:var(--Nk)} .tag.L{background:var(--leave);color:var(--muted)}
  .time{font-size:12px;color:var(--muted);margin-top:3px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:13px;font-weight:600;background:#EEF2F7;border:1px solid #DCE3EC;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .chip small{font-weight:500;color:var(--muted);margin-left:3px}
  .chip.me{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip.me small{color:#C9D7E6}
  .gap{color:var(--red);background:var(--redbg);font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;display:inline-block}
  .muted{color:var(--muted);font-size:13px}
  .btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:600 13px system-ui;color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.danger{color:var(--red)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;font:600 12px system-ui;padding:7px 10px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--navy);color:#fff}
  .ppnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;flex-wrap:wrap}
  .ppnav h2{font-size:16px;margin:0}
  .ppnav h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
  /* schedule grid */
  .gridwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
  table.sch{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
  .sch th,.sch td{border-right:1px solid #E6EAF0;border-bottom:1px solid #E6EAF0;text-align:center;padding:0;height:32px;min-width:34px}
  .sch .nm{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:0 10px;font-weight:600;font-size:13px;min-width:96px;white-space:nowrap;box-shadow:1px 0 0 #DDE3EA}
  .sch thead th{background:#F7F9FB;color:var(--muted);font-weight:700;position:sticky;top:0}
  .sch thead .nm{background:#F7F9FB;z-index:3}
  .sch thead .pp{color:var(--ink);font-size:12px;letter-spacing:.3px;border-bottom:1px solid #D3DAE3;text-align:left;padding-left:10px;height:26px}
  .sch thead .dt b{display:block;color:var(--ink);font-size:13px}
  .sch th.hol{background:#FDEFEF;color:var(--red)} .sch th.hol b{color:var(--red)}
  .sch .today{box-shadow:inset 2px 0 0 var(--navy),inset -2px 0 0 var(--navy)}
  .sch thead th.today{background:var(--navy);color:#C9D7E6} .sch thead th.today b{color:#fff}
  .sch .grp td{background:#EDF1F6;text-align:left;padding:0 10px;font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--navy2);position:sticky;left:0;height:26px}
  .sch td.c{cursor:default;font-weight:700;font-size:11px}
  .sch td.c.ed{cursor:pointer}
  .sch td.c.ed:hover{outline:2px solid #7FB2E5;outline-offset:-2px}
  .sch td.past,.sch th.past{opacity:.38}
  .sch td.D{background:var(--D);color:var(--Dk)} .sch td.S{background:var(--S);color:var(--Sk)} .sch td.N{background:var(--N);color:var(--Nk)}
  .sch td.L{background:repeating-linear-gradient(135deg,#EEF0F3 0 4px,#E3E6EB 4px 8px);color:#3E4A5B;font-size:10px}
  .sch td.x{position:relative} .sch td.x::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#14202E;opacity:.55}
  .trb{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#FFF1D6;color:#8A5A00;border-radius:4px;padding:1px 4px;vertical-align:1px}
  .tbd{font-size:10px;font-weight:500;color:var(--muted)}
  .sch tr.me .nm{color:var(--navy);background:#EEF4FB}
  .sch tr.otrow td{height:30px;background:#FFFBF2;border-top:2px solid #E9C46A}
  .sch tr.otrow .nm{font-weight:800;color:#8A5A00;background:#FFF4DC;letter-spacing:.5px}
  .sch tr.otrow td.ot{background:#F59E0B;color:#fff;font-weight:800;font-size:11px;cursor:pointer}
  .sch tr.otrow td.otadd{cursor:pointer}
  .sch tr.otrow td.otadd:hover::after{content:"+";color:#C98F00;font-weight:800}
  .sch tr.otrow td.ot.otf{background:#DDF3E6;color:#16693F}
  .sch tr.otrow td.ot.pend{background:#FDE7B5;color:#8A5A00;outline:2px dashed #D08A00;outline-offset:-3px}
  .sch tr.cov td{height:24px;font-size:11px;font-weight:700;color:var(--muted);background:#FAFBFC}
  .sch tr.cov td.zero{color:var(--red);background:var(--redbg)}
  .sch tr.cov .nm{font-weight:600;font-size:11px;color:var(--muted);background:#FAFBFC}
  .legend{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .sw{display:inline-block;width:16px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(14,26,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  @media (min-width:700px){.scrim{align-items:center}}
  .sheet{background:#fff;width:100%;max-width:440px;border-radius:16px 16px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom))}
  @media (min-width:700px){.sheet{border-radius:16px}}
  .sheet h3{margin:0 0 2px;font-size:17px}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font:600 13px system-ui;cursor:pointer;color:var(--ink)}
  .opt.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
  .opt.D{background:var(--D)} .opt.S{background:var(--S)} .opt.N{background:var(--N)}
  .olabel{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
  /* forms */
  label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
  input,select{font:15px system-ui;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
  input[type=checkbox]{width:auto}
  .form{max-width:360px;margin:30px auto}
  .form .f{margin-bottom:12px}
  table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:14px}
  .t th,.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .t th{background:#F7F9FB;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .t td input,.t td select{padding:6px 8px;font-size:14px}
  .sect{margin:24px 0 8px;font-size:15px}
  table.people{border:0;background:none}
  .hrsed{margin-top:6px}
  .chat{max-width:760px;margin:0 auto}
  .cnote{font-size:12px;color:#6B5600;background:#FFF8DD;border:1px solid #F0E2A6;border-radius:10px;padding:8px 12px;margin-bottom:10px}
  .clist{padding:4px 2px 8px}
  .cday{text-align:center;margin:14px 0 8px}
  .cday span{font-size:11.5px;font-weight:600;color:var(--muted);background:#E9EDF2;border-radius:999px;padding:3px 10px}
  .cmsg{display:flex;flex-direction:column;align-items:flex-start;margin-top:10px;max-width:82%}
  .cmsg.cont{margin-top:3px}
  .cmsg.mine{align-items:flex-end;margin-left:auto}
  .cwho{font-size:12px;font-weight:700;color:var(--navy2);margin:0 0 3px 4px}
  .cbubble{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:8px 12px;font-size:14.5px;line-height:1.4;white-space:normal;word-wrap:break-word;overflow-wrap:anywhere}
  .cmsg.mine .cbubble{background:var(--navy);border-color:var(--navy);color:#fff;border-radius:16px 16px 5px 16px}
  .cmeta{font-size:11px;color:var(--muted);margin:3px 6px 0}
  .clink{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
  .cbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:10px 0 12px;border-top:1px solid var(--line)}
  .cbar textarea{flex:1;resize:none;font:15px Inter,system-ui;padding:10px 12px;border:1px solid #CFD7E1;border-radius:12px;min-height:42px;max-height:140px;background:#fff}
  .cbar textarea:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(23,59,97,.15)}
  .cbar .btn{height:42px;padding:0 18px;border-radius:12px}
  @media (max-width:700px){ .cbar{bottom:calc(58px + env(safe-area-inset-bottom))} .cmsg{max-width:88%} }
  .logbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  table.log td{font-size:13px} table.log .nowrap{white-space:nowrap;color:var(--muted)}
  .trainrow{display:flex;gap:6px;align-items:flex-end;margin-top:8px;flex-wrap:wrap}
  .trainrow label.mini{margin:0;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:2px}
  .trainrow select{width:auto;min-width:80px}
  .trainrow input[type=date]{width:auto;padding:6px 8px;font-size:14px}
  .hrsrow{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
  .hrsrow select{width:auto;min-width:96px}
  .hrsrow label.mini{margin:0;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:2px}
  .hrsrow input[type=time]{width:auto;padding:6px 8px;font-size:14px}
  .hrsnote{font-size:11.5px;color:var(--muted);margin-top:4px}
  .hrsnote:empty{display:none}
  table.people tbody.person{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(14,42,71,.04)}
  table.people tbody.person + tbody.person{border-top:14px solid var(--bg)}
  table.people tbody.person tr:first-child td{border-bottom:1px dashed var(--line);padding-top:12px}
  table.people tbody.person tr:first-child td:first-child{border-left:4px solid var(--navy)}
  table.people tbody.person tr:last-child td{border-bottom:0;padding-bottom:12px;background:#FAFBFD}
  table.people tbody.person tr:last-child td:first-child{border-left:4px solid var(--navy)}
  table.people thead th{background:none;border-bottom:0}
  .scroll{overflow-x:auto}
  .pat{display:grid;justify-content:start;grid-template-columns:44px repeat(7,50px);gap:3px;align-items:center;font-size:11px;color:var(--muted)}
  .pat select{padding:4px 2px;font-size:13px;text-align:center}
  .pat select.D{background:var(--D)} .pat select.S{background:var(--S)} .pat select.N{background:var(--N)}
  .sch td.pend{background-image:repeating-linear-gradient(135deg,rgba(232,150,0,.38) 0 4px,rgba(255,255,255,.0) 4px 8px)!important;outline:2px dashed #D08A00;outline-offset:-3px;color:#7A4D00;font-style:italic}
  .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:#E5484D;color:#fff;font-size:11px;line-height:18px;text-align:center}
  .st{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-radius:5px;padding:2px 7px}
  .st.pending{background:#FFF1D6;color:#8A5A00} .st.approved{background:#DDF3E6;color:#16693F} .st.denied{background:var(--redbg);color:var(--red)} .st.cancelled{background:#EEF0F3;color:var(--muted)}
  .req{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .req .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .req .what{font-weight:700;font-size:15px}
  .req .days{font-size:12px;color:var(--muted);margin-top:4px}
  .otnew{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
  .queue{margin:4px 0 0;padding-left:20px;font-size:13px}
  .queue li{padding:4px 0}
  .queue li .btn,.queue li .warn{margin-left:8px}
  .warn{color:var(--red);font-size:12px;font-weight:600;margin-top:6px}
  .okc{color:#16693F;font-size:12px;margin-top:6px}
  .rform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
  .preview{font-size:13px;margin-top:10px;color:var(--ink)}
  #installBar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;max-width:460px;margin:0 auto;
    background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px rgba(14,42,71,.22);padding:14px;display:flex;gap:12px;align-items:flex-start}
  body.inapp #installBar{bottom:calc(72px + env(safe-area-inset-bottom))}
  #installBar img{width:48px;height:48px;border-radius:11px;flex:none;border:1px solid var(--line)}
  #installBar .ib-t{font-weight:700;font-size:14.5px;color:var(--navy)}
  #installBar .ib-d{font-size:13px;color:#3E4C5E;margin-top:3px;line-height:1.45}
  #installBar .ib-d svg{width:16px;height:16px;vertical-align:-3px;color:#007AFF}

<script type="module">
// =====================================================================
//  CONFIG — paste your Supabase project URL and anon (public) key.
//  Leave empty to run in DEMO mode (spreadsheet data, saved on this device only).
// =====================================================================
const CONFIG = {
  SUPABASE_URL: 'https://jnbkhmzbjzzmbcqyzhdf.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_zHp5UJWFYEe0piE_YwPjIQ_ec-7j6cc',   // public (publishable) key — safe in the page
};
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const PP_EPOCH = '2026-10-04';          // start of PP 08 (a Sunday). Pay periods are 14 days.
const LEAVE_CODES = ['VC', 'FH', 'PL', 'SK', 'FI'];           // request dropdown
const ADMIN_LEAVE_CODES = [...LEAVE_CODES, 'HO'];               // admin editor (+ Other…)
const COVER_SHIFTS = ['S', 'N'];                                 // only Swing & Grave must be filled

// ---------- dates (phone's local time) -------------------------------
const pad = n => String(n).padStart(2, '0');
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return toStr(d); };
const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);
const mod = (a, n) => ((a % n) + n) % n;
const dow = s => parse(s).getDay();
const todayStr = () => toStr(new Date());
const at = (s, t) => { const [h, m] = t.split(':').map(Number); const d = parse(s); d.setHours(h, m, 0, 0); return d; };
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DL = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const t5 = t => (t || '').slice(0, 5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// pay periods: PP 01 is the period that contains July 1
const ppStart = s => addDays(PP_EPOCH, Math.floor(diffDays(PP_EPOCH, s) / 14) * 14);
function ppNumber(start) {
  const y = parse(start).getFullYear();
  let p01 = ppStart(`${y}-07-01`);
  if (start < p01) p01 = ppStart(`${y - 1}-07-01`);
  return diffDays(p01, start) / 14 + 1;
}
const ppLabel = start => `PP ${pad(ppNumber(start))}`;

// ---------- state ----------------------------------------------------
const state = {
  admin: false, signedIn: false, mustChange: false, requests: [], otSignups: [], otPosts: [], messages: [], draft: null, otPick: 'S',
  shiftTypes: [], staff: [], rotations: [], exceptions: [], holidays: [],
  me: null, loggedIn: false, tab: 'schedule', pp: ppStart(todayStr()),
  span: window.innerWidth >= 1000 ? 2 : 1, log: [],
};

// ---------- schedule logic -------------------------------------------
// Chief on top, everyone else alphabetical by the name shown on the schedule
const byName = (a, b) => (levelOf(b) >= 3) - (levelOf(a) >= 3) || a.short_name.localeCompare(b.short_name);
const activeStaff = () => state.staff.filter(p => p.active).sort(byName);
const shiftByCode = c => state.shiftTypes.find(s => s.code === c);
const sortedShifts = () => [...state.shiftTypes].sort((a, b) => a.sort_order - b.sort_order);
const holidayOn = s => state.holidays.find(h => h.holiday_date === s);
const timed = st => st.start_time && st.end_time;

function rotationFor(staffId, s) {
  let best = null;
  for (const r of state.rotations) {
    if (r.staff_id !== staffId || r.effective_from > s || (r.effective_to && r.effective_to < s)) continue;
    if (!best || r.effective_from > best.effective_from) best = r;
  }
  return best;
}
const patternCode = (r, s) => (r && r.pattern[mod(diffDays(PP_EPOCH, s), 14)]) || null;
const exceptionFor = (id, s) => state.exceptions.find(e => e.staff_id === id && e.work_date === s);

// What is this person doing on date s?
//   { code: 'D'|'S'|'N'|null, leave: 'VC'|'HO'|…|null, ex: exception|undefined, regular: pattern code }
function assignment(p, s) {
  const regular = patternCode(rotationFor(p.id, s), s);
  const hol = holidayOn(s);
  const ex = exceptionFor(p.id, s);
  if (ex) return ex.kind === 'off' ? { code: null, leave: ex.leave_code || null, ex, regular } : { code: ex.shift_code, ex, regular, hol };
  if (hol && p.grp === 'admin') return { code: null, leave: 'HO', regular, hol };  // admin support is off on City holidays
  return { code: regular, regular, hol };
}
const otOf = (p, d) => state.otSignups.filter(g => g.staff_id === p.id && g.work_date === d && g.status === 'assigned').map(g => g.shift_code);
const worksShift = (p, d, code) => assignment(p, d).code === code || otOf(p, d).includes(code);
const crew = (s, code) => activeStaff().filter(p => worksShift(p, s, code));
// trainees are shown but don't count toward coverage
const levelOf = p => p?.level || 1;
const isTrainee = (p, s) => !!p.trainee_until && s <= p.trainee_until;
const covered = (s, code) => crew(s, code).filter(p => !isTrainee(p, s)).length;

// ---------- requests -------------------------------------------------
const staffById = id => state.staff.find(p => p.id === id);
const workingOn = (p, s) => assignment(p, s).code !== null;
const datesIn = (a, b) => { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; };
const affectedDays = r => { const p = staffById(r.staff_id); return datesIn(r.start_date, r.end_date).filter(d => r.kind === 'change' || workingOn(p, d)); };
const pendingFor = (p, s) => state.requests.find(r => r.status === 'pending' && r.staff_id === p.id && r.start_date <= s && s <= r.end_date && (r.kind === 'change' || workingOn(p, s)));
// ASO II → any ASO III or Chief; ASO III → Chief; Chief → admin ID. Admin ID approves anything.
function canApprove(r) {
  if (isAdmin()) return true;
  const me = state.me, req = staffById(r.staff_id);
  return !!me && !!req && me.id !== req.id && levelOf(me) >= 2 && levelOf(me) > levelOf(req);
}
const isApprover = () => isAdmin() || levelOf(state.me) >= 2;
const approverText = p => levelOf(p) === 2 ? 'the Chief' : 'any ASO III or the Chief';
const reqWhat = r => r.kind === 'leave' ? `${r.leave_code} — time off`
  : `Work ${shiftByCode(r.shift_code)?.name || r.shift_code}${r.start_time ? ` ${t5(r.start_time)}–${t5(r.end_time)}` : ''}`;
const reqDates = r => r.start_date === r.end_date ? `${DOW[dow(r.start_date)]} ${md(r.start_date)}` : `${DOW[dow(r.start_date)]} ${md(r.start_date)} – ${DOW[dow(r.end_date)]} ${md(r.end_date)}`;
// Coverage after approving a time-off request: which timed shifts drop to 0?
// ---------- OT --------------------------------------------------------
// Swing/Grave need at least one non-trainee. OT is triggered when someone on
// leave (requested or approved) was the only one left on that shift.
const onPendingLeave = (p, d) => state.requests.some(r => r.status === 'pending' && r.kind === 'leave' && r.staff_id === p.id && r.start_date <= d && d <= r.end_date);
const onDuty = (p, d, code, withOT = true) => (withOT ? worksShift(p, d, code) : assignment(p, d).code === code) && !isTrainee(p, d) && !onPendingLeave(p, d);
// Swing/Grave left empty because someone on it is on leave (OT ignored).
function gapNeed(d, code) {
  if (!COVER_SHIFTS.includes(code) || activeStaff().some(p => onDuty(p, d, code, false))) return null;
  const leavers = activeStaff().filter(p => {
    if (isTrainee(p, d)) return false;
    const a = assignment(p, d);
    if (onPendingLeave(p, d) && a.code === code) return true;                           // waiting for approval
    return !a.code && a.ex?.kind === 'off' && a.ex.leave_code && a.regular === code;      // approved / entered leave
  });
  return leavers.length ? { leavers, pending: leavers.every(p => onPendingLeave(p, d)) } : null;
}
const postFor = (d, code) => state.otPosts.find(x => x.work_date === d && x.shift_code === code && x.status === 'open');
// Every OT opportunity on a day: a leave gap (1 position) + any shift a supervisor opened (n positions).
function otOpps(d) {
  return ['N', 'D', 'S'].map(code => {
    const gap = gapNeed(d, code), post = postFor(d, code), assigned = otFilled(d).filter(g => g.shift_code === code);
    if (!gap && !post && !assigned.length) return null;
    const capacity = (gap ? 1 : 0) + (post ? post.slots : 0);
    const assignable = (gap && !gap.pending ? 1 : 0) + (post ? post.slots : 0);   // gap can't be filled until leave is approved
    return { date: d, code, gap, post, leavers: gap?.leavers || [], pending: !!gap?.pending && !post, capacity, assignable, assigned,
      remaining: capacity - assigned.length, canAssignNow: assignable - assigned.length > 0 };
  }).filter(Boolean);
}
const otNeeds = d => otOpps(d).filter(o => o.remaining > 0);
// Which days of this request would trigger OT?
function otTriggers(r) {
  if (r.kind !== 'leave') return [];
  const p = staffById(r.staff_id), out = [];
  for (const d of affectedDays(r)) {
    const code = r.status === 'approved' ? assignment(p, d).regular : assignment(p, d).code;
    if (!COVER_SHIFTS.includes(code) || isTrainee(p, d)) continue;
    if (!activeStaff().some(o => o.id !== p.id && onDuty(o, d, code))) out.push({ date: d, code });
  }
  return out;
}
const canAssignOT = () => isAdmin() || levelOf(state.me) >= 2;
// Shifts in time order: Grave(d) [starts the evening before] → Day(d) → Swing(d) → Grave(d+1) …
// A double (2 back-to-back) is OK; 3 in a row is not (18-hour limit).
const SLOT = { N: 0, D: 1, S: 2 };
const slotOf = (d, code) => diffDays(PP_EPOCH, d) * 3 + SLOT[code];
function otClash(p, d, code) {
  const a = assignment(p, d);
  if (a.leave && a.leave !== 'HO') return 'on leave that day';
  const set = new Set();
  for (let i = -2; i <= 2; i++) {
    const dd = addDays(d, i), c = assignment(p, dd).code;
    if (c) set.add(slotOf(dd, c));
    for (const o of otOf(p, dd)) set.add(slotOf(dd, o));
  }
  const k = slotOf(d, code);
  if (set.has(k)) return 'already working that shift';
  set.add(k);
  for (let i = k - 2; i <= k; i++) if (set.has(i) && set.has(i + 1) && set.has(i + 2)) return 'would be 3 shifts in a row (18-hour limit)';
  return null;
}
function signupBlock(p, d, code) {          // why this person can't sign up (null = can)
  if (!p) return 'Sign in to sign up';
  if (onPendingLeave(p, d)) return "You're on leave that day";
  return otClash(p, d, code);
}
const signupsFor = (d, code) => state.otSignups.filter(x => x.work_date === d && x.shift_code === code && x.status !== 'withdrawn').sort((a, b) => a.created_at.localeCompare(b.created_at));
const otFilled = d => state.otSignups.filter(g => g.status === 'assigned' && g.work_date === d);
const otText = list => list.map(x => `${shiftByCode(x.code)?.name} ${DOW[dow(x.date)]} ${md(x.date)}`).join(' · ');

function interval(s, st) {
  const start = at(st.starts_prev_day ? addDays(s, -1) : s, st.start_time);
  let end = at(s, st.end_time);
  if (!st.starts_prev_day && end <= start) end = at(addDays(s, 1), st.end_time);
  return { start, end };
}
// Personal hours: one-day custom hours > the person's own hours for that shift > the shift's standard hours.
const parseHours = h => { const m = /^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})$/.exec(h || ''); return m ? [m[1].padStart(5, '0'), m[2].padStart(5, '0')] : null; };
const hoursFor = (p, code) => parseHours(p.hours?.[code]);
function personTimes(p, d, code) {
  const ex = assignment(p, d).ex, st = shiftByCode(code);
  if (ex?.kind === 'work' && ex.shift_code === code && ex.start_time) return [t5(ex.start_time), t5(ex.end_time)];
  return hoursFor(p, code) || (timed(st) ? [t5(st.start_time), t5(st.end_time)] : null);
}
function personInterval(p, d, code) {
  const t = personTimes(p, d, code); if (!t) return null;
  return interval(d, { ...shiftByCode(code), start_time: t[0], end_time: t[1] });
}
const hoursLabel = (p, d, code) => { const t = personTimes(p, d, code), st = shiftByCode(code);
  return t && !(timed(st) && t[0] === t5(st.start_time) && t[1] === t5(st.end_time)) ? `${t[0]}–${t[1]}` : ''; };
// Every timed shift a person works around `now`, using their own hours.
function personShifts(now) {
  const t = toStr(now), out = [];
  for (const d of [addDays(t, -1), t, addDays(t, 1), addDays(t, 2)])
    for (const p of activeStaff())
      for (const code of ['N', 'D', 'S']) {
        if (!worksShift(p, d, code)) continue;
        const iv = personInterval(p, d, code);
        if (iv) out.push({ p, d, code, iv });
      }
  return out;
}
function onDutyNow(now) {
  const groups = new Map();
  for (const x of personShifts(now).filter(x => x.iv.start <= now && now < x.iv.end)) {
    const k = x.code; if (!groups.has(k)) groups.set(k, { st: shiftByCode(k), list: [] }); groups.get(k).list.push(x);
  }
  return [...groups.values()].sort((a, b) => SLOT[a.st.code] - SLOT[b.st.code]);
}
function nextShift(now) {
  const up = personShifts(now).filter(x => x.iv.start > now).sort((a, b) => a.iv.start - b.iv.start);
  if (!up.length) return null;
  const first = up[0].iv.start;
  return { start: first, list: up.filter(x => +x.iv.start === +first) };
}
const dutyLine = (st, list) => `<div class="sl"><span class="tag ${st.code}">${esc(st.name)}</span><div style="flex:1">
  <div class="chips">${list.map(x => chipOf(x.p, `${hm(x.iv.start)}–${hm(x.iv.end)}${otOf(x.p, x.d).includes(x.code) && assignment(x.p, x.d).code !== x.code ? ' · OT' : ''}`)).join('')}</div></div></div>`;

// When a new pattern starts on `from`: patterns starting on/after it are
// replaced; the one running through it ends the day before.
function rotationPlan(rotations, staffId, from) {
  const mine = rotations.filter(r => r.staff_id === staffId);
  return {
    del: mine.filter(r => r.effective_from >= from).map(r => r.id),
    close: mine.filter(r => r.effective_from < from && (!r.effective_to || r.effective_to >= from)).map(r => ({ id: r.id, effective_to: addDays(from, -1) })),
  };
}

// =====================================================================
//  Data layer — Supabase, or in-memory demo
// =====================================================================
const KEYS = ['shiftTypes', 'staff', 'rotations', 'exceptions', 'holidays', 'requests', 'otSignups', 'otPosts', 'messages'];
const demoApi = {
  db: null,
  async init() {
    try { this.db = JSON.parse(localStorage.getItem('landside-demo-v11') || 'null'); } catch { this.db = null; }
    if (!this.db) this.db = (await import('./demo-data.js')).demoSeed();
    this.db.requests ||= []; this.db.otSignups ||= []; this.db.otPosts ||= []; this.db.messages ||= [];
    try { this.who = localStorage.getItem('landside-demo-user-v11'); } catch {}
    state.loggedIn = true;
  },
  save() { try { localStorage.setItem('landside-demo-v11', JSON.stringify(this.db)); } catch {} },
  async load() {
    for (const k of KEYS) state[k] = structuredClone(this.db[k]);
    state.me = state.staff.find(p => p.id === this.who) || null;
    state.admin = this.who === 'admin' || state.me?.role === 'admin';
    state.signedIn = !!this.who;
  },
  async signIn(email) {
    const id = email === 'admin@lawa.org' ? 'admin' : this.db.staff.find(p => p.active && p.email === email)?.id;
    if (!id) throw new Error('No account with that ID');
    this.who = id; try { localStorage.setItem('landside-demo-user-v11', id); } catch {}
  },
  async signOut() { this.who = null; try { localStorage.removeItem('landside-demo-user-v11'); } catch {} },
  log(table, action, row) { state.log.unshift({ changed_at: new Date().toISOString(), actor_email: state.me?.email, table_name: table, action, new_data: row }); },
  async setException(staffId, date, change) {
    this.db.exceptions = this.db.exceptions.filter(e => !(e.staff_id === staffId && e.work_date === date));
    if (change) { const row = { id: crypto.randomUUID(), staff_id: staffId, work_date: date, ...change }; this.db.exceptions.push(row); this.log('exceptions', 'UPSERT', row); }
    else this.log('exceptions', 'DELETE', { staff_id: staffId, work_date: date });
    this.save();
  },
  async saveStaff(row) {
    if (row.id) { const i = this.db.staff.findIndex(p => p.id === row.id); this.db.staff[i] = { ...this.db.staff[i], ...row }; }
    else this.db.staff.push({ ...row, id: crypto.randomUUID(), sort_order: this.db.staff.length + 1 });
    this.log('staff', row.id ? 'UPDATE' : 'INSERT', row); this.save();
  },
  async setRotation(staffId, pattern, from) {
    const plan = rotationPlan(this.db.rotations, staffId, from);
    this.db.rotations = this.db.rotations.filter(r => !plan.del.includes(r.id));
    for (const u of plan.close) this.db.rotations.find(r => r.id === u.id).effective_to = u.effective_to;
    const row = { id: crypto.randomUUID(), staff_id: staffId, pattern, effective_from: from, effective_to: null };
    this.db.rotations.push(row); this.log('rotations', 'INSERT', row); this.save();
  },
  async saveShiftType(st) { const i = this.db.shiftTypes.findIndex(s => s.code === st.code); this.db.shiftTypes[i] = { ...this.db.shiftTypes[i], ...st }; this.save(); },
  async addHoliday(h) { this.db.holidays = this.db.holidays.filter(x => x.holiday_date !== h.holiday_date); this.db.holidays.push({ id: crypto.randomUUID(), ...h }); this.log('holidays', 'INSERT', h); this.save(); },
  async deleteHoliday(id) { this.db.holidays = this.db.holidays.filter(h => h.id !== id); this.log('holidays', 'DELETE', { id }); this.save(); },
  async loadLog() {},
  async changePassword() { throw new Error('Not available in demo mode'); },
  async submitRequest(r) {
    const me = state.me; if (!me) throw new Error('Sign in as a person on the roster first');
    if (r.end_date < r.start_date) throw new Error('End date is before start date');
    if (r.start_date < todayStr()) throw new Error('Requests can only be for today or later');
    const row = { id: crypto.randomUUID(), staff_id: me.id, status: 'pending', created_at: new Date().toISOString(), decided_by_name: null, decided_at: null, ...r };
    if (r.kind === 'leave' && !affectedDays(row).length) throw new Error('You are not scheduled to work on any of those days');
    this.db.requests.push(row); this.log('requests', 'INSERT', row);
    if (levelOf(me) >= 3) this.applyApproved(row, `${me.short_name} (auto)`);   // Chief: granted on submit
    this.save();
  },
  applyApproved(r, by) {
    const days = affectedDays(r);   // computed before the schedule changes
    Object.assign(r, { status: 'approved', decided_at: new Date().toISOString(), decided_by_name: by });
    for (const d of days) {
      this.db.exceptions = this.db.exceptions.filter(e => !(e.staff_id === r.staff_id && e.work_date === d));
      this.db.exceptions.push(r.kind === 'leave'
        ? { id: crypto.randomUUID(), staff_id: r.staff_id, work_date: d, kind: 'off', shift_code: null, leave_code: r.leave_code, start_time: null, end_time: null, request_id: r.id }
        : { id: crypto.randomUUID(), staff_id: r.staff_id, work_date: d, kind: 'work', shift_code: r.shift_code, leave_code: null, start_time: r.start_time, end_time: r.end_time, request_id: r.id });
    }
  },
  async cancelRequest(id) {
    const r = this.db.requests.find(x => x.id === id);
    if (!r || r.status !== 'pending' || r.staff_id !== state.me?.id) throw new Error('Only your own pending requests can be cancelled');
    r.status = 'cancelled'; r.decided_at = new Date().toISOString(); this.save();
  },
  async otSignup(d, code) {
    const me = state.me, why = signupBlock(me, d, code);
    if (why) throw new Error(why);
    if (d < todayStr()) throw new Error('That date has passed');
    if (!otNeeds(d).some(o => o.code === code)) throw new Error('That shift is not open for OT');
    const ex = this.db.otSignups.find(x => x.work_date === d && x.shift_code === code && x.staff_id === me.id);
    if (ex && ex.status !== 'withdrawn') return;
    if (ex) Object.assign(ex, { status: 'interested', created_at: new Date().toISOString() });
    else this.db.otSignups.push({ id: crypto.randomUUID(), work_date: d, shift_code: code, staff_id: me.id, status: 'interested', created_at: new Date().toISOString() });
    this.save();
  },
  async postMessage(body) {
    const t = body.trim(); if (!t) throw new Error('Message is empty');
    const nm = state.me?.short_name || (isAdmin() ? 'Admin' : null); if (!nm) throw new Error('Sign in first');
    this.db.messages.push({ id: (this.db.messages.at(-1)?.id || 0) + 1, created_at: new Date().toISOString(), staff_id: state.me?.id || null,
      sender_email: state.me?.email || 'admin', sender_name: nm, body: t.slice(0, 1000) });
    this.save();
  },
  async deleteMessage(id) {
    const m = this.db.messages.find(x => x.id === id);
    if (!m || !(isAdmin() || (state.me && m.staff_id === state.me.id))) throw new Error('You can only delete your own messages');
    this.db.messages = this.db.messages.filter(x => x.id !== id); this.save();
  },
  async loadMessages() { state.messages = structuredClone(this.db.messages); },
  async otPost(d, code, slots) {
    if (!canAssignOT()) throw new Error('Only an ASO III, the Chief or the admin can open OT');
    const ex = this.db.otPosts.find(x => x.work_date === d && x.shift_code === code && x.status === 'open');
    if (ex) ex.slots = slots;
    else this.db.otPosts.push({ id: crypto.randomUUID(), work_date: d, shift_code: code, slots, status: 'open', created_by_name: state.me?.short_name || 'Admin', created_at: new Date().toISOString() });
    this.log('ot_posts', 'OPEN', { work_date: d, shift_code: code, slots }); this.save();
  },
  async otUnpost(d, code) {
    if (!canAssignOT()) throw new Error('Only an ASO III, the Chief or the admin can remove OT');
    const post = this.db.otPosts.find(x => x.work_date === d && x.shift_code === code && x.status === 'open');
    const opp = otOpps(d).find(o => o.code === code);
    if (opp && opp.assigned.length > opp.assignable - (post?.slots || 0)) throw new Error('Someone is already assigned to this OT — ask the admin to remove it from the schedule first');
    if (post) post.status = 'cancelled';
    if (!opp?.gap) for (const x of this.db.otSignups) if (x.work_date === d && x.shift_code === code && x.status === 'interested') x.status = 'withdrawn';
    this.save();
  },
  async otWithdraw(d, code) {
    const ex = this.db.otSignups.find(x => x.work_date === d && x.shift_code === code && x.staff_id === state.me?.id && x.status === 'interested');
    if (!ex) throw new Error('You are not on the list for that OT');
    ex.status = 'withdrawn'; ex.decided_at = new Date().toISOString(); this.save();
  },
  async otAssign(id) {
    if (!canAssignOT()) throw new Error('Only an ASO III, the Chief or the admin can assign OT');
    const sg = this.db.otSignups.find(x => x.id === id);
    if (!sg || sg.status !== 'interested') throw new Error('That sign-up is no longer open');
    if (sg.staff_id === state.me?.id && !isAdmin()) throw new Error("You can't assign OT to yourself");
    const opp = otOpps(sg.work_date).find(o => o.code === sg.shift_code);
    if (!opp?.canAssignNow) throw new Error('No OT position open to assign — the leave may not be approved yet');
    const why = otClash(staffById(sg.staff_id), sg.work_date, sg.shift_code); if (why) throw new Error("Can't assign: " + why);
    const by = state.me?.short_name || 'Admin', now = new Date().toISOString();
    Object.assign(sg, { status: 'assigned', decided_by_name: by, decided_at: now });
    if (opp.assigned.length + 1 >= opp.assignable)     // all positions filled
      for (const x of this.db.otSignups) if (x.work_date === sg.work_date && x.shift_code === sg.shift_code && x.status === 'interested')
        Object.assign(x, { status: 'not_selected', decided_by_name: by, decided_at: now });
    this.log('ot_signups', 'ASSIGN', sg); this.save();
  },
  async decideRequest(id, approve) {
    const r = this.db.requests.find(x => x.id === id);
    if (!r || r.status !== 'pending') throw new Error('This request was already decided');
    if (!canApprove(r)) throw new Error('You are not allowed to approve this request');
    const by = state.me?.short_name || 'Admin';
    if (approve) this.applyApproved(r, by);
    else Object.assign(r, { status: 'denied', decided_at: new Date().toISOString(), decided_by_name: by });
    this.log('requests', approve ? 'APPROVE' : 'DENY', r); this.save();
  },
};

const supaApi = {
  sb: null, email: null,
  async init() {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    this.sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data } = await this.sb.auth.getSession();
    state.loggedIn = !!data.session; this.email = data.session?.user?.email?.toLowerCase() || null;
    this.sb.auth.onAuthStateChange((_e, session) => {
      const was = state.loggedIn;
      state.loggedIn = !!session; this.email = session?.user?.email?.toLowerCase() || null;
      if (was !== state.loggedIn) refresh();
    });
  },
  ok(res) { if (res.error) throw new Error(res.error.message); return res.data; },
  async load() {
    if (!state.loggedIn) { state.me = null; state.admin = false; state.signedIn = false; state.mustChange = false; return; }
    const since = addDays(todayStr(), -200);
    const r = await Promise.all([
      this.sb.from('shift_types').select('*'), this.sb.from('staff').select('*'), this.sb.from('rotations').select('*'),
      this.sb.from('exceptions').select('*').gte('work_date', since), this.sb.from('holidays').select('*'),
      this.sb.from('requests').select('*').gte('end_date', since).order('created_at', { ascending: false }),
      this.sb.from('ot_signups').select('*').gte('work_date', since),
      this.sb.from('ot_posts').select('*').eq('status', 'open').gte('work_date', since),
    ]);
    [state.shiftTypes, state.staff, state.rotations, state.exceptions, state.holidays, state.requests, state.otSignups, state.otPosts] = r.map(x => this.ok(x));
    await this.loadMessages().catch(() => { state.messages = []; });
    state.me = state.staff.find(p => p.email === this.email) || null;
    state.admin = !!this.ok(await this.sb.rpc('is_admin'));
    state.signedIn = true;
    const { data: u } = await this.sb.auth.getUser();
    state.mustChange = !u?.user?.user_metadata?.pw_set;   // first sign-in with the default password
  },
  async signIn(email, password) { this.ok(await this.sb.auth.signInWithPassword({ email, password })); },
  async signOut() { await this.sb.auth.signOut(); },
  async setException(staffId, date, change) {
    if (!change) return this.ok(await this.sb.from('exceptions').delete().eq('staff_id', staffId).eq('work_date', date));
    this.ok(await this.sb.from('exceptions').upsert({ staff_id: staffId, work_date: date, ...change }, { onConflict: 'staff_id,work_date' }));
  },
  async saveStaff(row) {
    if (row.id) { const { id, ...rest } = row; this.ok(await this.sb.from('staff').update(rest).eq('id', id)); }
    else this.ok(await this.sb.from('staff').insert({ ...row, sort_order: state.staff.length + 1 }));
  },
  async setRotation(staffId, pattern, from) {
    const plan = rotationPlan(state.rotations, staffId, from);
    if (plan.del.length) this.ok(await this.sb.from('rotations').delete().in('id', plan.del));
    for (const u of plan.close) this.ok(await this.sb.from('rotations').update({ effective_to: u.effective_to }).eq('id', u.id));
    this.ok(await this.sb.from('rotations').insert({ staff_id: staffId, pattern, effective_from: from }));
  },
  async saveShiftType(st) { const { code, ...rest } = st; this.ok(await this.sb.from('shift_types').update(rest).eq('code', code)); },
  async addHoliday(h) { this.ok(await this.sb.from('holidays').upsert(h, { onConflict: 'holiday_date' })); },
  async deleteHoliday(id) { this.ok(await this.sb.from('holidays').delete().eq('id', id)); },
  async loadLog() { state.log = this.ok(await this.sb.from('change_log').select('*').order('changed_at', { ascending: false }).limit(60)); },
  async changePassword(pw) { this.ok(await this.sb.auth.updateUser({ password: pw, data: { pw_set: true } })); },
  async submitRequest(r) {
    this.ok(await this.sb.rpc('submit_request', { p_start: r.start_date, p_end: r.end_date, p_kind: r.kind, p_leave_code: r.leave_code,
      p_shift_code: r.shift_code, p_start_time: r.start_time, p_end_time: r.end_time }));
  },
  async cancelRequest(id) { this.ok(await this.sb.rpc('cancel_request', { p_id: id })); },
  async decideRequest(id, approve) { this.ok(await this.sb.rpc('decide_request', { p_id: id, p_approve: approve })); },
  async otSignup(d, code) { this.ok(await this.sb.rpc('ot_signup', { p_date: d, p_code: code })); },
  async otWithdraw(d, code) { this.ok(await this.sb.rpc('ot_withdraw', { p_date: d, p_code: code })); },
  async otAssign(id) { this.ok(await this.sb.rpc('ot_assign', { p_signup: id })); },
  async loadMessages() {
    const rows = this.ok(await this.sb.from('messages').select('*').order('id', { ascending: false }).limit(300));
    state.messages = rows.reverse();
  },
  async postMessage(body) { this.ok(await this.sb.rpc('post_message', { p_body: body })); },
  async deleteMessage(id) { this.ok(await this.sb.from('messages').delete().eq('id', id)); },
  async otPost(d, code, slots) { this.ok(await this.sb.rpc('ot_post', { p_date: d, p_code: code, p_slots: slots })); },
  async otUnpost(d, code) { this.ok(await this.sb.rpc('ot_unpost', { p_date: d, p_code: code })); },
};

function renderSchedule() {
  const now = new Date(), today = todayStr(), shifts = sortedShifts();
  // --- today card
  const hol = holidayOn(today);
  const out = activeStaff().map(p => [p, assignment(p, today)]).filter(([, a]) => a.leave && a.leave !== 'HO');
  const todayCard = `<div class="card"><h3>Today · ${DOW[dow(today)]} ${md(today)}${hol ? ` · <span style="color:var(--red)">${esc(hol.name)}</span>` : ''}</h3>
    ${shifts.map(st => shiftLine(today, st)).join('')}
    ${otNeeds(today).map(x => `<div class="sl"><span class="tag" style="background:#F59E0B;color:#fff">OT</span><div style="flex:1"><b>${esc(shiftByCode(x.code)?.name)} OT open${x.remaining > 1 ? ` · ${x.remaining} positions` : ''}</b><div class="time">${x.gap ? `${x.leavers.map(p => esc(p.short_name)).join(', ')} off${x.pending ? ' · pending approval' : ''}` : `Opened by ${esc(x.post.created_by_name)}`}</div></div></div>`).join('')}
    ${out.length ? `<div class="sl"><span class="tag L">Leave</span><div class="chips" style="flex:1">${out.map(([p, a]) => chipOf(p, a.leave)).join('')}</div></div>` : ''}</div>`;
  // --- now / next card (timed shifts only)
  const duty = onDutyNow(now), nxt = nextShift(now);
  const mins = nxt ? Math.round((nxt.start - now) / 60000) : 0;
  const inTxt = `${Math.floor(mins / 60) ? Math.floor(mins / 60) + 'h ' : ''}${mins % 60}m`;
  const nowCard = `<div class="card"><h3>On duty now · ${hm(now)}</h3>
    ${duty.length ? duty.map(g => dutyLine(g.st, g.list)).join('') : '<p class="muted" style="margin:4px 0">No Swing or Grave shift right now.</p>'}
    ${nxt ? `<h3 style="margin-top:12px">Next · in ${inTxt}</h3>${[...new Set(nxt.list.map(x => x.code))].map(c => dutyLine(shiftByCode(c), nxt.list.filter(x => x.code === c))).join('')}` : ''}</div>`;

  // --- pay-period grid
  const days = [...Array(14 * state.span)].map((_, i) => addDays(state.pp, i));
  const pps = [...Array(state.span)].map((_, i) => addDays(state.pp, i * 14));
  const last = days[days.length - 1], d0 = parse(state.pp), dl = parse(last);
  const range = `${MON[d0.getMonth()]} ${d0.getDate()} – ${MON[dl.getMonth()]} ${dl.getDate()}, ${dl.getFullYear()}`;
  const th = s => { const h = holidayOn(s); return `<th class="dt ${s < today ? 'past' : ''} ${s === today ? 'today' : ''} ${h ? 'hol' : ''}" ${h ? `title="${esc(h.name)}"` : ''}>${DL[dow(s)]}<b>${parse(s).getDate()}</b></th>`; };
  let html = `<div class="gridwrap"><table class="sch"><thead>

    const people = activeStaff().filter(p => p.grp === g);

  for (const st of shifts.filter(x => COVER_SHIFTS.includes(x.code))) {
    html += `<tr class="cov"><td class="nm">${esc(st.name)} count</td>` + days.map(s => { const n = covered(s, st.code); return `<td class="${n ? '' : 'zero'} ${s === today ? 'today' : ''}">${n}</td>`; }).join('') + `</tr>`;

// ---------- activity log ---------------------------------------------
// Built from requests and OT records. Admin, Chief and ASO III see everyone;

const seesAllLog = () => isAdmin() || levelOf(state.me) >= 2;
function logEvents() {
  const ev = [], name = id => staffById(id)?.short_name || '—';
  const otWhat = g => `${shiftByCode(g.shift_code)?.name} OT · ${DOW[dow(g.work_date)]} ${md(g.work_date)}`;
  for (const r of state.requests) {
    const what = `${reqWhat(r)} · ${reqDates(r)}`;
    ev.push({ at: r.created_at, who: r.staff_id, action: 'Requested', type: 'request', what, by: name(r.staff_id) });
    if (r.decided_at && r.status !== 'pending') ev.push({ at: r.decided_at, who: r.staff_id, type: 'request',
      action: { approved: 'Approved', denied: 'Denied', cancelled: 'Cancelled' }[r.status], what,
      by: r.status === 'cancelled' ? name(r.staff_id) : (r.decided_by_name || '—') });
  }
  for (const g of state.otSignups) {
    ev.push({ at: g.created_at, who: g.staff_id, action: 'Signed up for OT', type: 'ot', what: otWhat(g), by: name(g.staff_id) });
    if (g.decided_at && g.status !== 'interested') ev.push({ at: g.decided_at, who: g.staff_id, type: 'ot',
      action: { assigned: 'OT assigned', not_selected: 'OT not selected', withdrawn: 'Withdrew from OT' }[g.status], what: otWhat(g),
      by: g.status === 'withdrawn' ? name(g.staff_id) : (g.decided_by_name || '—') });
  }
  for (const x of state.otPosts) ev.push({ at: x.created_at, who: null, action: 'Opened OT', type: 'ot',
    what: `${shiftByCode(x.shift_code)?.name} × ${x.slots} · ${DOW[dow(x.work_date)]} ${md(x.work_date)}`, by: x.created_by_name || '—' });
  return ev.filter(e => e.at).sort((a, b) => b.at.localeCompare(a.at));
}
function renderLog() {
  const all = seesAllLog(), f = state.logFilter ||= { who: 'all', type: 'all' };
  let ev = logEvents();

    const box = document.getElementById('chatBox'), body = box.value.trim(); if (!body) return;
    box.disabled = true;
    api.postMessage(body).then(() => api.loadMessages()).then(() => renderChat()).catch(err => { box.disabled = false; toast(err.message, true); });
    return;
  }
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Signing in…';
  run(() => api.signIn(loginEmail(document.getElementById('lEmail').value), document.getElementById('lPw').value))
    .then(ok => { if (ok) { document.getElementById('toast').innerHTML = ''; state.tab = 'schedule'; render(); } else { btn.disabled = false; btn.textContent = 'Sign in'; } });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $modal.innerHTML = '';
  if (e.target.id === 'chatBox' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.getElementById('chatForm').requestSubmit(); }
});
document.addEventListener('input', e => { if (e.target.id === 'chatBox') { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; } });
setInterval(() => { if (state.tab === 'schedule' && !$modal.innerHTML && $auth.hidden) render(); }, 60000);

// ---------- "install the app" prompt (phones only) ---------------------
const $ib = document.getElementById('installBar');
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const IB_KEY = 'landside-install-dismissed';
const ibDismissed = () => { try { return Date.now() < (+localStorage.getItem(IB_KEY) || 0); } catch { return false; } };
const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
function showInstall() {
  if (isInstalled() || ibDismissed() || !(isIOS || isAndroid)) { $ib.hidden = true; return; }
  const icon = `<img src="${document.querySelector('link[rel=apple-touch-icon]')?.getAttribute('href') || 'icon-192.png'}" alt="">`;
  let body;
  if (isAndroid && window.__bip) body = `<div class="ib-t">Install LAX Landside</div>
      <div class="ib-d">Add the app to your home screen for one-tap access.</div>
      <div class="ib-a"><button class="btn primary" id="ibInstall">Install</button><button class="btn" id="ibLater">Not now</button></div>`;
  else if (isAndroid) body = `<div class="ib-t">Install LAX Landside</div>
      <div class="ib-d">In Chrome, tap the <b>⋮</b> menu (top right), then <b>Install app</b> or <b>Add to Home screen</b>.</div>
      <div class="ib-a"><button class="btn" id="ibLater">Got it</button></div>`;
  else body = `<div class="ib-t">Add LAX Landside to your Home Screen</div>
      <div class="ib-d">Tap the Share button ${SHARE_ICON} ${/CriOS|FxiOS|EdgiOS/.test(UA) ? '(in the address bar)' : 'at the bottom of Safari'}, then choose <b>Add to Home Screen</b>.</div>
      <div class="ib-a"><button class="btn" id="ibLater">Got it</button></div>`;
  $ib.innerHTML = icon + `<div style="flex:1">${body}</div>`;
  $ib.hidden = false;
}
$ib.addEventListener('click', async e => {
  if (e.target.id === 'ibInstall' && window.__bip) {
    window.__bip.prompt();
    try { const r = await window.__bip.userChoice; if (r.outcome === 'accepted') $ib.hidden = true; } catch {}
    window.__bip = null; return;
  }
  if (e.target.id === 'ibLater') { try { localStorage.setItem(IB_KEY, Date.now() + 14 * 864e5); } catch {} $ib.hidden = true; }
});
window.addEventListener('bip-ready', showInstall);
window.addEventListener('appinstalled', () => { $ib.hidden = true; });
// keep the banner above the bottom tab bar once signed in
new MutationObserver(() => document.body.classList.toggle('inapp', !$shell.hidden)).observe($shell, { attributes: true, attributeFilter: ['hidden'] });
setTimeout(showInstall, 1200);
setInterval(async () => { if (!$auth.hidden || state.tab === 'chat') return; try { await api.loadMessages(); renderTabs(); } catch {} }, 45000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$modal.innerHTML && state.tab !== 'requests') refresh(); });

try { await api.init(); } catch (e) { $auth.hidden = false; $auth.innerHTML = `<div class="card"><p class="gap">Could not start: ${esc(e.message)}</p></div>`; }
await refresh();
</script>
</body>
</html>
